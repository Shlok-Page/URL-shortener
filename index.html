<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkCut - URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-new.css">
</head>
<body>
    <h1>LinkCut</h1>
    <p class="tagline">Shorten your links instantly</p>

    <div class="container">
        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="long-url" 
                    placeholder="Paste your long URL here..."
                >
                <button class="btn" onclick="shortenURL()">Shorten</button>
            </div>
            <div id="error-message" class="error-message"></div>
        </div>

        <div id="result-section" class="result-section">
            <div class="result-item">
                <div class="result-info">
                    <div class="result-label">Your Short Link</div>
                    <div class="result-text" id="short-url-display"></div>
                </div>
                <button class="copy-btn" onclick="copyToClipboard()" id="copy-btn">Copy</button>
            </div>

            <div class="result-item">
                <div class="result-info">
                    <div class="result-label">Original URL</div>
                    <div class="result-text" id="original-url-display"></div>
                </div>
            </div>

            <div class="qr-section">
                <h3>Scan QR Code</h3>
                <img id="qr-code" src="" alt="QR Code">
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="total-urls">0</div>
                    <div class="stat-label">URLs Shortened</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="total-clicks">0</div>
                    <div class="stat-label">Total Clicks</div>
                </div>
            </div>
        </div>

        <div class="history-section">
            <h2>Your Links</h2>
            <div id="history-list"></div>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 LinkCut - Created by Shlok Page</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
