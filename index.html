<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkCut - URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0e163a;
            color: white;
            min-height: 100vh;
            padding: 20px;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.light-mode {
            background: #f5f5f5;
            color: #333;
        }

        .settings-top {
            position: static;
            display: flex;
            justify-content: center;
            gap: 12px;
            align-items: center;
            z-index: 100;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        body.light-mode .settings-top {
            background: rgba(50, 50, 50, 0.15);
            border-color: rgba(50, 50, 50, 0.2);
        }

        .settings-top label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        body.light-mode .settings-top label {
            color: rgba(50, 50, 50, 0.8);
        }

        .settings-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.light-mode .settings-button {
            background: rgba(50, 50, 50, 0.15);
            color: #333;
        }

        .settings-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: rotate(20deg);
        }

        #light-mode-toggle {
            margin-right: 8px;
            cursor: pointer;
        }

        h1 {
            font-size: 48px;
            text-align: center;
            margin-bottom: 30px;
            font-family: Impact, "Arial Black", sans-serif;
            font-weight: 900;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        body.light-mode .input-section {
            background: rgba(50, 50, 50, 0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #long-url {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            color: #333;
        }

        #long-url:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        body.light-mode #long-url {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn {
            padding: 12px 30px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ff5252;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
        }

        body.light-mode .result-section {
            background: rgba(50, 50, 50, 0.1);
        }

        .result-section.active {
            display: block;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-info {
            flex: 1;
        }

        .result-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .result-text {
            font-size: 16px;
            word-break: break-all;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        body.light-mode .result-text {
            background: rgba(50, 50, 50, 0.1);
        }

        .copy-btn {
            padding: 10px 15px;
            background-color: #4ecdc4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background-color: #45b8b8;
        }

        .copy-btn.copied {
            background-color: #51cf66;
        }

        .qr-section {
            text-align: center;
            margin-top: 20px;
        }

        .qr-section h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        #qr-code {
            max-width: 200px;
            margin: 0 auto;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            flex: 1;
            background: rgba(255, 107, 107, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b6b;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .history-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        body.light-mode .history-section {
            background: rgba(50, 50, 50, 0.1);
        }

        .history-section h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.light-mode .history-item {
            background: rgba(50, 50, 50, 0.05);
        }

        .history-url {
            flex: 1;
            word-break: break-all;
        }

        .history-short {
            font-weight: bold;
            color: #ffdd57;
            margin-bottom: 5px;
        }

        .history-long {
            font-size: 12px;
            opacity: 0.7;
        }

        .history-clicks {
            background: rgba(255, 107, 107, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            min-width: 50px;
            text-align: center;
        }

        .delete-btn {
            padding: 8px 12px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background-color: #ff5252;
        }

        .empty-message {
            text-align: center;
            opacity: 0.6;
            padding: 20px;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 0.7;
            font-size: 14px;
        }

        body.light-mode .footer {
            border-top-color: rgba(50, 50, 50, 0.2);
            color: rgba(50, 50, 50, 0.7);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }

            .input-group {
                flex-direction: column;
            }

            .result-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .copy-btn {
                width: 100%;
            }

            .history-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .history-clicks,
            .delete-btn {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="settings-top">
        <label for="light-toggle">THEME:</label>
        <input type="checkbox" id="light-toggle" onchange="toggleTheme()">
        <span id="theme-label">Light Mode</span>
    </div>

    <h1>LinkCut</h1>

    <div class="container">
        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="long-url" 
                    placeholder="Enter your long URL here... (e.g., https://www.example.com/very/long/url)"
                >
                <button class="btn" onclick="shortenURL()">Shorten</button>
            </div>
            <div id="error-message" style="color: #ff6b6b; font-size: 12px; display: none;"></div>
        </div>

        <div id="result-section" class="result-section">
            <div class="result-item">
                <div class="result-info">
                    <div class="result-label">Shortened URL</div>
                    <div class="result-text" id="short-url-display"></div>
                </div>
                <button class="copy-btn" onclick="copyToClipboard()" id="copy-btn">Copy</button>
            </div>

            <div class="result-item">
                <div class="result-info">
                    <div class="result-label">Original URL</div>
                    <div class="result-text" id="original-url-display"></div>
                </div>
            </div>

            <div class="qr-section">
                <h3>Scan QR Code</h3>
                <img id="qr-code" src="" alt="QR Code">
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="total-urls">0</div>
                    <div class="stat-label">URLs Shortened</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="total-clicks">0</div>
                    <div class="stat-label">Total Clicks</div>
                </div>
            </div>
        </div>

        <div class="history-section">
            <h2>Your Links</h2>
            <div id="history-list"></div>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 LinkCut - Created by Shlok Page</p>
    </div>

    <script>
        const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        const SHORT_CODE_LENGTH = 6;

        // Generate random short code
        function generateShortCode() {
            let code = "";
            for (let i = 0; i < SHORT_CODE_LENGTH; i++) {
                code += CHARS.charAt(Math.floor(Math.random() * CHARS.length));
            }
            return code;
        }

        // Validate URL
        function isValidURL(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        // Shorten URL
        function shortenURL() {
            const longURL = document.getElementById("long-url").value.trim();
            const errorMsg = document.getElementById("error-message");

            // Clear error
            errorMsg.style.display = "none";
            errorMsg.textContent = "";

            if (!longURL) {
                errorMsg.textContent = "Please enter a URL";
                errorMsg.style.display = "block";
                return;
            }

            if (!isValidURL(longURL)) {
                errorMsg.textContent = "Please enter a valid URL (include https://)";
                errorMsg.style.display = "block";
                return;
            }

            // Generate short code
            let shortCode = generateShortCode();
            const urls = getURLs();

            // Make sure code is unique
            while (urls[shortCode]) {
                shortCode = generateShortCode();
            }

            // Save to storage
            urls[shortCode] = {
                long: longURL,
                short: shortCode,
                clicks: 0,
                created: new Date().toLocaleString()
            };
            localStorage.setItem("urls", JSON.stringify(urls));

            // Display result
            displayResult(shortCode, longURL);
            updateHistory();

            // Clear input
            document.getElementById("long-url").value = "";
        }

        // Display result
        function displayResult(shortCode, longURL) {
            const shortURLDisplay = `${window.location.href.split('?')[0]}?s=${shortCode}`;
            
            document.getElementById("short-url-display").textContent = shortURLDisplay;
            document.getElementById("original-url-display").textContent = longURL;
            
            // Generate QR Code
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(shortURLDisplay)}`;
            document.getElementById("qr-code").src = qrUrl;

            // Show result section
            document.getElementById("result-section").classList.add("active");

            // Update stats
            updateStats();
        }

        // Copy to clipboard
        function copyToClipboard() {
            const shortURL = document.getElementById("short-url-display").textContent;
            navigator.clipboard.writeText(shortURL).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.textContent = "Copied!";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.textContent = "Copy";
                    btn.classList.remove("copied");
                }, 2000);
            });
        }

        // Get all URLs from storage
        function getURLs() {
            const stored = localStorage.getItem("urls");
            return stored ? JSON.parse(stored) : {};
        }

        // Update stats
        function updateStats() {
            const urls = getURLs();
            const totalURLs = Object.keys(urls).length;
            const totalClicks = Object.values(urls).reduce((sum, url) => sum + url.clicks, 0);

            document.getElementById("total-urls").textContent = totalURLs;
            document.getElementById("total-clicks").textContent = totalClicks;
        }

        // Update history display
        function updateHistory() {
            const urls = getURLs();
            const historyList = document.getElementById("history-list");

            if (Object.keys(urls).length === 0) {
                historyList.innerHTML = '<div class="empty-message">No shortened URLs yet. Create one to get started!</div>';
                return;
            }

            historyList.innerHTML = "";
            Object.values(urls).reverse().forEach(url => {
                const item = document.createElement("div");
                item.className = "history-item";
                item.innerHTML = `
                    <div class="history-url">
                        <div class="history-short">${window.location.href.split('?')[0]}?s=${url.short}</div>
                        <div class="history-long">${url.long}</div>
                        <div style="font-size: 11px; opacity: 0.6; margin-top: 5px;">Created: ${url.created}</div>
                    </div>
                    <div class="history-clicks">${url.clicks} clicks</div>
                    <button class="delete-btn" onclick="deleteURL('${url.short}')">Delete</button>
                `;
                historyList.appendChild(item);
            });

            updateStats();
        }

        // Delete URL
        function deleteURL(shortCode) {
            const urls = getURLs();
            delete urls[shortCode];
            localStorage.setItem("urls", JSON.stringify(urls));
            updateHistory();
        }

        // Toggle light mode
        function toggleTheme() {
            const toggle = document.getElementById("light-toggle");
            
            if (toggle.checked) {
                document.body.classList.add("light-mode");
                localStorage.setItem("theme", "light");
                document.getElementById("theme-label").textContent = "Light Mode";
            } else {
                document.body.classList.remove("light-mode");
                localStorage.setItem("theme", "dark");
                document.getElementById("theme-label").textContent = "Light Mode";
            }
        }

        // Load theme preference
        function loadTheme() {
            const saved = localStorage.getItem("theme");
            if (saved === "light") {
                document.getElementById("light-toggle").checked = true;
                document.body.classList.add("light-mode");
            }
        }

        // Handle short URL redirect
        function handleRedirect() {
            const params = new URLSearchParams(window.location.search);
            const shortCode = params.get("s");

            if (shortCode) {
                const urls = getURLs();
                if (urls[shortCode]) {
                    urls[shortCode].clicks++;
                    localStorage.setItem("urls", JSON.stringify(urls));
                    window.location.href = urls[shortCode].long;
                } else {
                    alert("Short link not found");
                }
            }
        }

        // Initialize on page load
        window.addEventListener("load", () => {
            loadTheme();
            updateHistory();
            handleRedirect();
        });

        // Allow Enter key to shorten
        document.getElementById("long-url").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                shortenURL();
            }
        });
    </script>
</body>
</html>
