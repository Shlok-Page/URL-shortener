<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkCut - URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>LinkCut</h1>
    <p class="tagline">Shorten your links instantly</p>

    <div class="container">
        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="long-url" 
                    placeholder="Paste your long URL here..."
                >
                <button class="btn" onclick="shortenURL()">Shorten</button>
            </div>
            <div id="error-message" class="error-message"></div>
        </div>

        <div id="result-section" class="result-section">
            <div class="result-item">
                <div class="result-info">
                    <div class="result-label">Your Short Link</div>
